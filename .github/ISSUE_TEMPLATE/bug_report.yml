name: Bug report
description: Something on the site or in the admin panel does not work.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Keep security problems and personal data out of public issues; see the Security policy instead.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Yayasan site
        - SMP portal
        - SMA portal
        - PPDB form
        - Admin panel
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "Android, Chrome 130"
